<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=600">
  <title>OPC-Agent 设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; color: #1E293B; background: #F8FAFC; padding: 32px; }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { font-size: 20px; font-weight: 700; color: #1E3A5F; margin-bottom: 4px; }
    p { color: #64748B; font-size: 13px; margin-bottom: 24px; }
    .card { background: white; border-radius: 12px; border: 1px solid #E2E8F0; padding: 20px; margin-bottom: 16px; }
    .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; font-weight: 500; color: #475569; margin-bottom: 4px; }
    .field input, .field select { width: 100%; padding: 8px 12px; border: 1px solid #E2E8F0; border-radius: 6px; font-size: 13px; outline: none; }
    .field input:focus, .field select:focus { border-color: #0891B2; box-shadow: 0 0 0 3px rgba(8,145,178,0.1); }
    .btn { padding: 8px 20px; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; }
    .btn-primary { background: #1E3A5F; color: white; }
    .btn-primary:hover { background: #2D5A8E; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #1E3A5F; color: white; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.3s; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ OPC-Agent 设置</h1>
    <p>配置 API 连接参数和默认行为</p>

    <div class="card">
      <h2>🔌 API 连接</h2>
      <div class="field">
        <label>API 地址</label>
        <input id="apiUrl" placeholder="http://localhost:8080/api/v1">
      </div>
      <div class="field">
        <label>API Key（可选）</label>
        <input id="apiKey" type="password" placeholder="tk_...">
      </div>
    </div>

    <div class="card">
      <h2>🤖 默认设置</h2>
      <div class="field">
        <label>默认 Agent</label>
        <select id="defaultAgent">
          <option value="copywriter">✍️ 文案生成</option>
          <option value="email_sorter">📧 邮件分类</option>
          <option value="xhs_poster">📕 小红书</option>
          <option value="competitive_analysis">📊 竞品分析</option>
          <option value="meeting_minutes">📋 会议纪要</option>
        </select>
      </div>
    </div>

    <button class="btn btn-primary" id="saveBtn">💾 保存设置</button>
  </div>
  <div class="toast" id="toast">✅ 设置已保存</div>
  <script src="options.js"></script>
</body>
</html>
